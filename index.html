<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ead8b8">
  <meta name="description" content="咕咕咪的窝：一只猫头鸡身小怪兽的像素养成小屋。取名、喂食、喝水、摸摸和闲聊。">
  <title>咕咕咪的窝 · 猫鸡养成</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== 像素图标库 ===== -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="pet-head" viewBox="0 0 20 20">
        <rect x="3" y="2" width="4" height="5" fill="#4b3223"/>
        <rect x="13" y="2" width="4" height="5" fill="#4b3223"/>
        <rect x="3" y="5" width="14" height="10" fill="#4b3223"/>
        <rect x="4" y="4" width="12" height="12" fill="#4b3223"/>
        <rect x="5" y="15" width="10" height="2" fill="#4b3223"/>
        <rect x="4" y="4" width="3" height="4" fill="#f0c979"/>
        <rect x="13" y="4" width="3" height="4" fill="#f0c979"/>
        <rect x="4" y="6" width="12" height="8" fill="#f0c979"/>
        <rect x="5" y="14" width="10" height="2" fill="#f0c979"/>
        <rect x="5" y="6" width="4" height="2" fill="#ffdfa2"/>
        <rect x="8" y="1" width="2" height="3" fill="#d94c46"/>
        <rect x="10" y="0" width="2" height="4" fill="#d94c46"/>
        <rect x="12" y="2" width="2" height="2" fill="#d94c46"/>
        <rect x="9" y="1" width="1" height="1" fill="#f6776c"/>
        <rect x="6" y="8" width="2" height="3" fill="#2e241d"/>
        <rect x="12" y="8" width="2" height="3" fill="#2e241d"/>
        <rect x="6" y="8" width="1" height="1" fill="#fff8e8"/>
        <rect x="12" y="8" width="1" height="1" fill="#fff8e8"/>
        <rect x="9" y="11" width="2" height="1" fill="#d47a7e"/>
        <rect x="9" y="12" width="1" height="1" fill="#7a4a35"/>
        <rect x="10" y="12" width="1" height="1" fill="#7a4a35"/>
        <rect x="8" y="13" width="1" height="1" fill="#7a4a35"/>
        <rect x="11" y="13" width="1" height="1" fill="#7a4a35"/>
        <rect x="9" y="14" width="1" height="2" fill="#d94c46"/>
        <rect x="10" y="15" width="1" height="1" fill="#d94c46"/>
        <rect x="5" y="11" width="1" height="1" fill="#ef9f92"/>
        <rect x="14" y="11" width="1" height="1" fill="#ef9f92"/>
      </symbol>

      <symbol id="i-fish" viewBox="0 0 16 16">
        <path fill="#4b3223" d="M1 6h2v1h1v1h1V5h1V4h6v1h2v1h1v4h-1v1h-2v1H6v-1H5v-1H4v2H3v-1H1V6z"/>
        <path fill="#efbf68" d="M2 7h2v1h1v1h1V6h1V5h5v1h2v1h1v2h-1v1h-2v1H6v-1H5v-1H4v1H2V7z"/>
        <rect x="9" y="6" width="2" height="2" fill="#4b3223"/>
        <rect x="9" y="6" width="1" height="1" fill="#fff8e8"/>
        <path fill="#d99a44" d="M6 9h4v2H6z"/>
      </symbol>

      <symbol id="i-drop" viewBox="0 0 16 16">
        <path fill="#4b3223" d="M7 1h2v2h2v2h2v6h-1v2H4v-2H3V5h2V3h2V1z"/>
        <path fill="#65b2d8" d="M7 2h2v2h2v2h1v5h-1v2H5v-2H4V6h1V4h2V2z"/>
        <rect x="6" y="7" width="2" height="3" fill="#c9edf8"/>
      </symbol>

      <symbol id="i-heart" viewBox="0 0 16 16">
        <rect x="3" y="3" width="4" height="2" fill="#e77883"/>
        <rect x="9" y="3" width="4" height="2" fill="#e77883"/>
        <rect x="2" y="5" width="12" height="4" fill="#e77883"/>
        <rect x="3" y="9" width="10" height="2" fill="#e77883"/>
        <rect x="5" y="11" width="6" height="2" fill="#e77883"/>
        <rect x="7" y="13" width="2" height="1" fill="#e77883"/>
        <rect x="4" y="4" width="2" height="1" fill="#ffb3ba"/>
      </symbol>

      <symbol id="i-chat" viewBox="0 0 16 16">
        <path fill="currentColor" d="M2 3h12v8H9v2H7v-2H2z"/>
        <rect x="4" y="5" width="2" height="2" fill="#fff8e8"/>
        <rect x="7" y="5" width="2" height="2" fill="#fff8e8"/>
        <rect x="10" y="5" width="2" height="2" fill="#fff8e8"/>
      </symbol>

      <symbol id="i-sound" viewBox="0 0 16 16">
        <path fill="currentColor" d="M2 6h3l3-3v10l-3-3H2z"/>
        <path fill="currentColor" d="M10 5h2v2h1v2h-1v2h-2v-1h1V6h-1z"/>
      </symbol>

      <symbol id="i-send" viewBox="0 0 16 16">
        <path fill="currentColor" d="M2 7h8V4l5 4-5 4v-3H2z"/>
      </symbol>

      <symbol id="i-edit" viewBox="0 0 16 16">
        <path fill="currentColor" d="M2 11l1-4 7-6 3 3-7 7-4 1zM4 10l2 2 1-3-2-2z"/>
      </symbol>

      <symbol id="i-corn" viewBox="0 0 16 16">
        <path fill="#4b3223" d="M6 1h4v2h2v9h-2v3H6v-3H4V3h2z"/>
        <rect x="7" y="3" width="2" height="8" fill="#f4c95a"/>
        <rect x="5" y="5" width="1" height="5" fill="#f4c95a"/>
        <rect x="10" y="5" width="1" height="5" fill="#f4c95a"/>
        <rect x="7" y="4" width="1" height="1" fill="#ffe28b"/>
        <rect x="8" y="6" width="1" height="1" fill="#ffe28b"/>
        <rect x="7" y="8" width="1" height="1" fill="#ffe28b"/>
        <rect x="8" y="10" width="1" height="1" fill="#ffe28b"/>
        <path fill="#7da35b" d="M4 5L1 4v7l3 1V5zm8 0l3-1v7l-3 1V5z"/>
        <path fill="#5c7f40" d="M4 7L2 6v3l2 1V7zm8 0l2-1v3l-2 1V7z"/>
      </symbol>

      <symbol id="i-rice" viewBox="0 0 16 16">
        <path fill="#4b3223" d="M8 1L1 14h14L8 1z"/>
        <path fill="#fff8e8" d="M8 4l4 8H4l4-8z"/>
        <rect x="5" y="11" width="6" height="3" fill="#405442"/>
        <rect x="7" y="7" width="1" height="1" fill="#d9cbb3"/>
        <rect x="9" y="9" width="1" height="1" fill="#d9cbb3"/>
      </symbol>
    </defs>
  </svg>

  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20"><use href="#pet-head"></use></svg>
        </div>
        <div>
          <h1 id="appTitle">咕咕咪的窝</h1>
          <p class="tagline">猫头鸡身 · 黄金小怪兽养成</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="level-chip" id="levelChip">Lv.1</div>
        <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭声音" title="声音已开启（音效 + BGM）" data-muted="false">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-sound"></use></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <!-- ===== 宠物舞台 ===== -->
      <section class="stage-panel panel" aria-label="宠物小屋">
        <div class="stage-head">
          <div class="name-plate">
            <span id="petNameLabel">咕咕咪</span>
            <span class="name-suffix">的小窝</span>
            <button class="mini-edit" id="editNameBtn" type="button" title="改名字" aria-label="改名字">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-edit"></use></svg>
            </button>
          </div>
          <div class="mood-chip" id="moodChip" data-tone="ok"><span class="mood-dot"></span><span id="moodText">悠闲地发着呆</span></div>
        </div>

        <div class="stage-wrap" id="stageWrap">
          <canvas id="petCanvas" width="400" height="320" aria-hidden="true"></canvas>
          <div class="speech-bubble" id="speechBubble" role="status" aria-live="polite"></div>
          <div class="float-layer" id="floatLayer" aria-hidden="true"></div>
          <div class="level-toast" id="levelToast" role="status" hidden>
            <span class="lt-spark">✦</span>
            <strong>LEVEL UP!</strong>
            <span id="levelToastTitle">Lv.2 · 饭搭子</span>
            <span class="lt-spark">✦</span>
          </div>
        </div>

        <div class="actions" id="actions" role="group" aria-label="互动">
          <button class="action-btn tone-feed" id="feedBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="foodTray">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-fish"></use></svg>
            <span>喂食</span>
          </button>
          <button class="action-btn tone-water" id="drinkBtn" type="button">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-drop"></use></svg>
            <span>喝水</span>
          </button>
          <button class="action-btn tone-pet" id="petBtn" type="button">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-heart"></use></svg>
            <span>摸摸</span>
          </button>
          <button class="action-btn tone-chat" id="chatBtn" type="button">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chat"></use></svg>
            <span>聊天</span>
          </button>
        </div>

        <div class="food-tray" id="foodTray" hidden>
          <div class="food-tray-head">
            <strong>今天想吃什么？</strong>
            <span>投喂会提升饱食度和亲密度</span>
          </div>
          <div class="food-options" id="foodOptions"></div>
        </div>
      </section>

      <aside class="side">
        <!-- ===== 状态 ===== -->
        <section class="stats-panel panel" aria-label="宠物状态">
          <div class="panel-title">
            <h2>状态</h2>
            <span class="mini-label" id="statusHint">三根小条正在慢慢变化</span>
          </div>

          <div class="stat-row" id="hungerRow">
            <svg class="stat-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-fish"></use></svg>
            <span class="stat-label">饱食</span>
            <div class="bar"><div class="bar-fill hunger-fill" id="hungerFill"></div></div>
            <span class="stat-value" id="hungerValue">82</span>
          </div>

          <div class="stat-row" id="thirstRow">
            <svg class="stat-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-drop"></use></svg>
            <span class="stat-label">水分</span>
            <div class="bar"><div class="bar-fill thirst-fill" id="thirstFill"></div></div>
            <span class="stat-value" id="thirstValue">78</span>
          </div>

          <div class="stat-row" id="moodRow">
            <svg class="stat-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-heart"></use></svg>
            <span class="stat-label">心情</span>
            <div class="bar"><div class="bar-fill mood-fill" id="moodFill"></div></div>
            <span class="stat-value" id="moodValue">84</span>
          </div>

          <div class="pixel-divider"></div>

          <div class="bond-box">
            <div class="bond-head">
              <span>亲密度</span>
              <span class="bond-level" id="bondLevel">Lv.1</span>
            </div>
            <div class="bond-title" id="bondTitle">陌生小鸡</div>
            <div class="bar bond-bar"><div class="bar-fill bond-fill" id="bondFill"></div></div>
            <p class="bond-meta" id="bondMeta">再攒 12 点升到 Lv.2</p>
          </div>
        </section>

        <!-- ===== 聊天 ===== -->
        <section class="chat-panel panel" id="chatPanel" aria-label="和宠物聊天">
          <div class="panel-title chat-title">
            <h2>和<span id="chatName">咕咕咪</span>聊天</h2>
            <span class="online-tag"><span class="online-dot"></span>本地闲聊</span>
          </div>
          <div class="chat-log" id="chatLog" aria-label="聊天记录"></div>
          <div class="quick-chips" id="quickChips" aria-label="快捷话题"></div>
          <form class="chat-form" id="chatForm">
            <label class="sr-only" for="chatInput">聊天输入框</label>
            <input id="chatInput" type="text" maxlength="80" autocomplete="off" placeholder="说点什么…它大概听得懂">
            <button class="send-btn" id="sendBtn" type="submit" aria-label="发送消息" title="发送">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-send"></use></svg>
            </button>
          </form>
        </section>
      </aside>
    </main>

    <footer class="footer">
      <span>本地存档 · 像素 BGM 由代码合成 · 断网也能养</span>
      <button class="text-btn" id="resetGameBtn" type="button">重新开始</button>
    </footer>
  </div>

  <!-- ===== 取名 / 改名 ===== -->
  <div class="modal-backdrop" id="nameModal" hidden>
    <div class="modal name-modal" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
      <button class="modal-close" id="nameCloseBtn" type="button" aria-label="关闭" hidden>×</button>
      <div class="modal-pet" aria-hidden="true">
        <svg viewBox="0 0 20 20"><use href="#pet-head"></use></svg>
      </div>
      <p class="eyebrow" id="nameEyebrow">第一位住客</p>
      <h2 id="nameModalTitle">给它取个名字吧</h2>
      <p class="modal-copy" id="nameModalCopy">一只猫头鸡身的黄金小怪兽，正在等一个名字。名字之后随时可以改。</p>
      <form id="nameForm">
        <label class="sr-only" for="nameInput">宠物名字</label>
        <input class="name-input" id="nameInput" type="text" maxlength="8" autocomplete="off" placeholder="比如：咕咕咪">
        <div class="name-suggestions" id="nameSuggestions">
          <button type="button" data-name="咕咕咪">咕咕咪</button>
          <button type="button" data-name="鸡米花">鸡米花</button>
          <button type="button" data-name="黄金团子">黄金团子</button>
          <button type="button" data-name="少爷">少爷</button>
        </div>
        <button class="primary-btn" id="nameSubmitBtn" type="submit">就住进我的窝</button>
      </form>
    </div>
  </div>

  <!-- ===== 重新开始确认 ===== -->
  <div class="modal-backdrop" id="resetModal" hidden>
    <div class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="resetTitle" aria-describedby="resetCopy">
      <div class="warn-mark" aria-hidden="true">!</div>
      <h2 id="resetTitle">要重新开始吗？</h2>
      <p class="modal-copy" id="resetCopy">名字、亲密度和聊天记录都会清空，这只小怪兽会忘记你。这个操作不能撤销。</p>
      <div class="modal-actions">
        <button class="ghost-btn" id="cancelResetBtn" type="button">再想想</button>
        <button class="danger-btn" id="confirmResetBtn" type="button">清空并重来</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
